name: tests

# Runs the test suite only. It never builds or publishes anything (see release.yml for that).
# To make it a merge requirement, add the checks "tests (ubuntu-latest, 3.10)" and
# "tests (ubuntu-latest, 3.12)" as required status checks of the branch protection of `main`.

on:
  pull_request:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # the Windows job is informational until the joblib/loky worker cleanup of the parallel
    # pruning test is fixed there (it fails with a "process not found" error on Windows)
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.12" ]
        include:
          - os: windows-latest
            python-version: "3.12"
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the package version is derived from the git tags (hatch-vcs)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the tests
        run: python -m pytest tests -q --cov=pyreco --cov-report=term-missing
